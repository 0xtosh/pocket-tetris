[platformio]
default_envs = lilygo_t_dongle_s3

[env:lilygo_t_dongle_s3]
platform = espressif32@6.12.0
framework = arduino
board = dongles3
monitor_speed = 115200
extra_scripts =
    pre:scripts/sanitize_paths.py
lib_deps =
    links2004/WebSockets @ ^2.6.1
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
